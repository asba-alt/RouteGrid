services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routegrid-postgres
    environment:
      POSTGRES_USER: routegrid
      POSTGRES_PASSWORD: routegrid_dev
      POSTGRES_DB: routegrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routegrid"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: routegrid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
